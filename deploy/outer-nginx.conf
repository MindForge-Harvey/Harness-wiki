    # BEGIN harness-wiki
    location = /harness-wiki {
        return 308 /harness-wiki/chat;
    }
    location = /_harness_wiki_auth {
        internal;
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $harness_auth http://harness-wiki:80;
        proxy_pass $harness_auth/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }
    location @harness_wiki_login {
        return 302 /api/auth/login?return_to=$request_uri;
    }
    location @harness_wiki_unauthorized {
        default_type application/json;
        return 401 '{"ok":false,"error":"登录已过期，请刷新页面重新登录"}';
    }
    location ^~ /harness-wiki/api/ {
        auth_request /_harness_wiki_auth;
        error_page 401 = @harness_wiki_unauthorized;
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $harness_wiki http://harness-wiki:80;
        rewrite ^/harness-wiki(/.*)$ $1 break;
        proxy_pass $harness_wiki;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location ^~ /harness-wiki/ {
        auth_request /_harness_wiki_auth;
        error_page 401 = @harness_wiki_login;
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $harness_wiki http://harness-wiki:80;
        rewrite ^/harness-wiki(/.*)$ $1 break;
        proxy_pass $harness_wiki;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # END harness-wiki
