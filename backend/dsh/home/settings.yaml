{
  "ui-theme": {
    "preference": "light"
  },
  "agent-presets": {
    "default": "cordis"
  },
  "agent-default-model": {
    "provider": "qwen-token-plan",
    "model": "qwen3.8-flash"
  },
  "llm-pi-ai": {
    "providers": {
      "qwen-token-plan": {
        "baseURL": "https://dashscope.aliyuncs.com/compatible-mode/v1",
        "api": "openai-completions",
        "apiKeyEnv": "LLM_API_KEY",
        "compat": {
          "supportsDeveloperRole": false,
          "supportsReasoningEffort": false,
          "thinkingFormat": "qwen"
        },
        "reasoning": "off",
        "models": [
          {
            "id": "qwen3.8-flash",
            "name": "qwen3.8-flash",
            "input": [
              "text"
            ],
            "contextWindow": 1000000,
            "maxTokens": 65536,
            "reasoningEfforts": {
              "off": null,
              "medium": "medium"
            }
          }
        ]
      },
      "aliyun-vision": {
        "baseURL": "https://dashscope.aliyuncs.com/compatible-mode/v1",
        "api": "openai-completions",
        "apiKeyEnv": "VLM_API_KEY",
        "compat": {
          "supportsDeveloperRole": false,
          "supportsReasoningEffort": false
        },
        "models": [
          {
            "id": "qwen3.8-omni-flash",
            "name": "qwen3.8-omni-flash",
            "input": [
              "text",
              "image"
            ],
            "contextWindow": 1000000,
            "maxTokens": 65536,
            "reasoningEfforts": false
          }
        ]
      }
    }
  }
}
