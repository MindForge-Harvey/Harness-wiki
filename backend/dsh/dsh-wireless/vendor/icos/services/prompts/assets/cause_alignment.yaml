# 决策步 05 根因对齐：模型以网优专家身份判「02 收敛出的根因 ⟷ ICOS 方案」的对应关系（2026-10-03 业务）
#
# 调用方：services/decision/cause_alignment.py::align_root_causes_llm（每单一次，决策链写回决策行之后）
# 输入：02 根因收敛（root_cause_convergence）的全部根因（带置信度与主因 / 次因 / 低置信结论）、工单问题类型、
#       本单全部 ICOS 方案（每个方案一个 plan_id + 方案组 + ICOS 标注 + 参数清单）
# 输出：每个方案一条对应关系（针对根因 / 通用收益 / 无关）+ 针对哪几条根因 + 一句理由
# 用途：「直接关联 / 次级关联 / 通用方案 / 不一致」四档由代码按「对上的根因里有没有主因」定，不交模型；
#       **判「无关」（→ 不一致）的方案在决策链里不下发**（业务 10-03，推翻 09-28「只写注记」）—— 剩下可发的全是
#       不一致时全留（不剔到零），本单没有达到阈值的根因（根因不明）时不剔。结果落裁决对象 alignment，
#       推演舱「根因对齐」一节开头的对应表与「生成方案」裁决表的「根因」列都读它
# 失败：bypass —— 记「对齐失败」，按初案一级/二级原因与根因名称、类别对上（确定性兜底，只注记、不剔方案）
#
# 占位符用 str.format 渲染，正文里字面量花括号必须写成 {{ }}（见输出示例）。

version: 1

scenes:
  root_cause_alignment:
    title: 根因对齐（根因与方案的对应关系）
    stage: 05 根因对齐
    caller: services.decision.cause_alignment.align_root_causes_llm
    output: json
    trigger: 每单每轮一次、决策链写回决策行之后；02 根因收敛没有读出任何根因时不调
    contract: services.decision.cause_alignment._ALIGNMENT_LLM_KEYS
    on_failure: bypass  # 调用失败/解析失败 → 按初案一级/二级原因与根因名称、类别对上，只注记、不剔方案
    placeholders:
      - ROOT_CAUSE_JSON
      - PROBLEM_JSON
      - PLANS_JSON
    template: |
      你是资深无线网络优化专家。下面给你**一张工单已经收敛好的根因**与 ICOS 为这张工单推来的**全部优化方案**。
      请逐个方案判断它与这些根因的对应关系：这个方案是针对哪一条（或哪几条）根因的处置，还是不针对某一条根因、
      只对本单问题整体有通用收益，还是与这些根因都对不上。

      --- 判定规则（硬约束，违反即废）
      0. **根因已经给定，不要另行收敛**：每条根因都来自上一步对工单原文的收敛，带 0–100 的置信度
         （原文对它的支撑强度）与结论（主因 / 次因 / 低置信）。只拿这几条根因判对应关系，不要自己补根因，
         也不要改动它们的名字。
      1. **按参数的实际作用判，不按标注判**：每个方案的 icos_category / group_name 是 ICOS 设计方案时的归类，
         可以参考，但对应关系要看方案里**参数本身的无线作用**与调整方向（f_para → b_para）。
         例如根因为「弱覆盖」时，抬升参考信号功率、放宽最低接收电平这类直接改善覆盖的方案针对它；
         方案组名写着「弱覆盖处理」、参数却是切换迟滞的，不针对弱覆盖。
      2. relation 只能取下面三个词之一：
         * 针对根因 —— 方案的作用机理直接处置其中至少一条根因；causes 列出它针对的那几条根因名（与输入**一字不差**）；
         * 通用收益 —— 不针对任何一条具体根因，但对本单问题类型对应的指标有通用的改善作用（如通用的切换、重传、
           功控类优化）；causes 给空数组；
         * 无关 —— 与这些根因都对不上，对本单问题也看不出通用收益；causes 给空数组。
      3. **只判对应关系，不判风险**：参数取什么值、风险大不大由后续的规则库校验决定；
         不要因为觉得风险大、步长大就说它「无关」。
      4. **「无关」的方案本轮不会下发**，所以只在你确信它与每一条根因都对不上、对本单问题也看不出通用收益时才判「无关」；
         拿不准是对得上某条根因还是只有通用收益时，判「通用收益」，不要判「无关」。
      5. 每个 plan_id 都要给一条，不要漏、不要编输入里没有的 plan_id；一个方案只给一条。
      6. reason 用一句话写清判断依据（参数 → 无线作用 → 对应的根因或指标），不超过 80 个字。
         reasoning 用一两句话总结整单：哪条根因有方案处置、哪条根因没有方案处置。
      7. 字符串里要引用词语时一律用「」，**不要用英文双引号 "** —— 没转义的英文双引号会让整段 JSON 失效。

      --- 输出 JSON（禁止 Markdown 代码块包裹、禁止 JSON 以外文字）
      {{
        "plans": [
          {{"plan_id": "LDJT005", "relation": "针对根因", "causes": ["弱覆盖"], "reason": "抬升参考信号功率扩大下行覆盖，直接处置弱覆盖"}},
          {{"plan_id": "LDJT022", "relation": "通用收益", "causes": [], "reason": "调整下行最大重传次数改善弱场下的传输成功率，不针对某一条根因"}},
          {{"plan_id": "LDJT031", "relation": "无关", "causes": [], "reason": "上行功控门限调整与弱覆盖、邻区漏配都对不上"}}
        ],
        "reasoning": "弱覆盖有 LDJT005 处置；邻区漏配没有方案处置。"
      }}

      --- 本单根因（JSON：causes 数组，每条 cause / category / confidence / standing / evidence；threshold 是采信阈值）
      {ROOT_CAUSE_JSON}

      --- 工单问题（JSON：task_type 是问题类型，即要改善的指标所在，不是根因）
      {PROBLEM_JSON}

      --- 本单全部方案（JSON，每个方案一个 plan_id；params 是该方案下的参数，f_para 现网值、b_para ICOS 建议值）
      {PLANS_JSON}
