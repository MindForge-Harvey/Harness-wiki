# llm_wiki 应用栈：本地前后端连接阿里云 LightRAG + MinerU。
# 启动：docker compose -f docker-compose.app.yml --env-file backend/.env up -d --build
# 停止：docker compose -f docker-compose.app.yml --env-file backend/.env down
# 默认只启动 backend/frontend；本地 LightRAG 归入 local-engines profile。
# MinerU 使用阿里云服务，本项目不启动本地 MinerU。
name: rag-kb

services:
  lightrag:
    profiles: [local-engines]
    image: ghcr.io/hkuds/lightrag:1.5.6
    container_name: lightrag-docker-0.6B
    restart: unless-stopped
    ports:
      - "9623:9621" # 宿主机沿用 9623 习惯端口，容器内 9621
    environment:
      HOST: 0.0.0.0
      PORT: 9621
      WORKING_DIR: /app/data/rag_storage
      INPUT_DIR: /app/data/inputs
      PROMPT_DIR: /app/data/prompts
      TIKTOKEN_CACHE_DIR: /app/data/tiktoken
      NO_PROXY: "*"
      no_proxy: "*"
    volumes:
      - ${KB_RAG_STORAGE:-./.local-data/rag_storage}:/app/data/rag_storage
      - ${KB_LIGHTRAG_INPUTS_DIR:-./.local-data/inputs}:/app/data/inputs
      - ${LIGHTRAG_DOTENV:-./backend/.env}:/app/.env:ro
      - ${LIGHTRAG_PROMPTS_DIR:-./.local-data/prompts}:/app/data/prompts

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rag-kb-backend
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      HOST: 0.0.0.0
      DSH_HOME_DIR: .runtime/dsh-home
    ports:
      - "127.0.0.1:3088:3088"
    volumes:
      # 会话、注册表、审计、意图账本与审批附件跨镜像升级持久化。
      - rag-kb-runtime:/app/backend/.runtime
      - rag-kb-spool:/app/backend/.spool
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3088/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    container_name: rag-kb-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80" # WEB_PORT 在 backend/.env 配置
    depends_on:
      - backend

volumes:
  rag-kb-runtime:
  rag-kb-spool:
