user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Docker 内置 DNS：让 proxy_pass 运行时解析 backend hostname，而不是启动时卡死
    # （backend 服务可能比 frontend 慢几秒起来）
    resolver 127.0.0.11 valid=30s ipv6=off;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # 基本设置
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # Gzip压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # 服务器配置
    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # 延迟解析后端地址（compose 网络内 backend 可能稍后才就绪）
        set $backend_upstream "http://backend:3088";

        # 安全头
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        # Refresh the SPA entry on navigation; fingerprinted assets override this below.
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

        # 认证端点（/api/auth/me、/api/auth/check）：免认证部署统一由适配层应答
        # （DISABLE_PORTAL_AUTH=1 时返回本地账号）；接入门户时再改回门户服务地址。
        location /api/auth/ {
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
        }

        # rag-kb 适配层（SSE 聊天/审批/知识库 REST；backend 为 compose 服务名）
        location /api/ {
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $http_connection;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Vite 指纹静态资源长期缓存（构建产物落盘在 /usr/share/nginx/html/assets/）
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # vis-network 本地副本（vendor 目录随构建一起拷入 dist）
        location /vendor/ {
            try_files $uri =404;
        }

        # 子路径前缀回退：直接访问容器带 /rag-harness/ 前缀时（外层 nginx 未剥离），
        # rewrite 去掉前缀后用 last 触发二次 location 匹配，让 /api/ /assets/ /vendor/ 等
        # 各自命中对应的前缀 location（proxy_pass / 静态缓存 / try_files）。
        # 外层 nginx 剥离前缀的场景下容器内收到的是 /api/ /assets/ / 等无前缀路径，
        # 不会落入这里，无副作用。
        location /rag-harness/ {
            rewrite ^/rag-harness/(.*)$ /$1 last;
        }

        # React 单页应用根路径
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 错误页面
        error_page 404 /index.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }

        # 禁止访问隐藏文件
        location ~ /\. {
            deny all;
        }
    }
}
